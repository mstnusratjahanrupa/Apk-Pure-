name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -storepass updater123 -alias updater -keypass updater123 -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10000 -dname "CN=Nusrat Jahan, OU=Voice Assistant, O=Personal, C=BD"

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Updater-Release-APK
        path: app/build/outputs/apk/release/*.apk
